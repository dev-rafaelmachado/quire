[package]
name = "quire-core"
description = "Scan, parse and index spec-driven folders (no Tauri dependency)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "7.0.0"
ignore = "0.4.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
toml = "1.2.1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[lints]
workspace = true

[dev-dependencies]
cpu-time = "1.0.0"
notify = "8.2.2"
tempfile = "3.27.0"
