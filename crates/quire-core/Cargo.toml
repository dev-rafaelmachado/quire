[package]
name = "quire-core"
description = "Scan, parse and index spec-driven folders (no Tauri dependency)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Derives specta::Type on the types the desktop shell exposes to TypeScript (TD-07).
specta = ["dep:specta"]

[dependencies]
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }
dirs = "7.0.0"
ignore = "0.4.34"
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
toml = "1.2.1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
notify = "8.2.2"
toml_edit = "0.25"

[lints]
workspace = true

[dev-dependencies]
cpu-time = "1.0.0"
tempfile = "3.27.0"
