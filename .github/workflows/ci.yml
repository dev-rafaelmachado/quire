name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Same commands as the phase gate in .specs/features/quire-v0-2/tasks.md
      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: typecheck
        run: pnpm -r typecheck

      - name: test (frontend)
        run: pnpm -r test

      # DEB-06, TD-20: the console helper answers in the terminal through bin\quire.cmd, in cmd
      # and in PowerShell, with the same exit codes as the app on Linux.
      - name: console helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p quire-cli
          $dir = Join-Path $env:RUNNER_TEMP 'quire-layout'
          New-Item -ItemType Directory -Force (Join-Path $dir 'bin') | Out-Null
          Copy-Item target\release\quire-cli.exe $dir
          Copy-Item apps\desktop\src-tauri\wix\quire.cmd (Join-Path $dir 'bin')
          $cmdFile = Join-Path $dir 'bin\quire.cmd'
          $help = (& $cmdFile --help) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "pwsh --help exited $LASTEXITCODE" }
          if ($help -notmatch 'Usage: quire \[path\]') { throw "unexpected help: $help" }
          $version = (& $cmdFile --version) -join ''
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^quire \d') { throw "pwsh --version: $version ($LASTEXITCODE)" }
          & $cmdFile --bogus 2>$null
          if ($LASTEXITCODE -ne 2) { throw "pwsh --bogus exited $LASTEXITCODE" }
          $cmdHelp = (cmd /c "`"$cmdFile`" --help") -join "`n"
          if ($LASTEXITCODE -ne 0 -or $cmdHelp -notmatch 'Usage: quire \[path\]') { throw "cmd --help: $LASTEXITCODE" }
          cmd /c "`"$cmdFile`" --bogus 2>nul"
          if ($LASTEXITCODE -ne 2) { throw "cmd --bogus exited $LASTEXITCODE" }
          # Without quire.exe next to it, a valid call explains and exits 1 (no window).
          cmd /c "`"$cmdFile`" . 2>nul"
          if ($LASTEXITCODE -ne 1) { throw "cmd . without the app exited $LASTEXITCODE" }

  # DEB-06, TD-20: the MSI installs quire-cli.exe and bin\quire.cmd and puts only bin on the
  # PATH; `quire --version` must answer in a fresh shell after a silent install.
  msi:
    name: msi install (windows-latest)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage the console helper
        shell: bash
        run: scripts/stage-quire-cli.sh

      - name: Build the MSI
        run: pnpm --filter desktop tauri build --bundles msi

      - name: Install silently and run quire from the PATH
        shell: pwsh
        run: |
          $msi = Get-ChildItem target\release\bundle\msi\*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec exited $($p.ExitCode)" }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $found = Get-Command quire
          Write-Output "quire resolves to $($found.Source)"
          if ($found.Source -notmatch 'quire\.cmd$') { throw "quire resolves to $($found.Source), not bin\quire.cmd" }
          $version = (quire --version) -join ''
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^quire \d') { throw "quire --version: $version ($LASTEXITCODE)" }
          Write-Output $version

      - name: Upload the install log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msi-install-log
          path: install.log
