# Builds the installers when a version tag is pushed (OSS-04) and attaches them to a draft
# GitHub release: Linux .AppImage and .deb, Windows .msi.
# Not executed yet: it runs only on a pushed tag, and no tag has been created.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an older glibc makes the AppImage run on more distributions.
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: msi
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # tauri build compiles the frontend (beforeBuildCommand) and the binary with the
      # custom protocol, then bundles.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Quire ${{ github.ref_name }}
          releaseBody: See README.md for installation and docs/e2e.md for the test script.
          releaseDraft: true
          prerelease: false
